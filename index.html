<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess Openings Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="update-banner" class="update-banner hidden">
    <span id="update-label">New version available</span>
    <a id="update-link" href="#" target="_blank" rel="noopener">Download</a>
    <button id="update-dismiss" aria-label="Dismiss">&times;</button>
  </div>
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#9812;</span>
      <h1>Chess Openings Trainer</h1>
    </div>
    <nav class="modes" id="modes">
      <button data-mode="practice" class="mode active">Practice</button>
      <button data-mode="tricks" class="mode">Tricks</button>
      <button data-mode="explore" class="mode">Explore</button>
    </nav>
    <div class="score">
      <span class="score-label">Score</span>
      <span id="score">0 / 0</span>
      <span class="score-goal" title="Session goal — score color turns green when met">Goal 80%</span>
      <button id="reset-score" title="Reset score">&#x21bb;</button>
      <span id="sync-indicator" class="sync-indicator hidden" title="Sync status"></span>
      <button id="settings-btn" title="Settings &amp; sync">&#x2699;</button>
    </div>
  </header>

  <div id="filterbar" class="filterbar hidden"></div>

  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal">
      <button class="modal-close" id="settings-close" title="Close">&times;</button>
      <h2>Settings &amp; sync</h2>
      <div id="settings-body"></div>
    </div>
  </div>

  <main class="layout">
    <section class="board-wrap">
      <div class="board-shell">
        <div id="board" class="board"></div>
        <div id="board-overlay" class="board-overlay hidden"></div>
      </div>
      <div class="eval-bar-horizontal hidden" id="eval-bar-horizontal">
        <div class="eval-bar-fill" id="eval-bar-fill"></div>
        <div class="eval-bar-label" id="eval-bar-label"></div>
      </div>
      <div class="current-opening" id="current-opening"></div>
      <div class="board-controls">
        <button id="flip-board" title="Flip board">&#x21c5; Flip</button>
        <button id="reset-board" title="Reset to start position">Reset</button>
        <button id="engine-toggle" title="Toggle engine analysis (eval bar + best move arrow)">Engine: off</button>
        <span class="turn-indicator" id="turn-indicator">White to move</span>
      </div>
    </section>

    <aside class="panel" id="panel">
      <!-- Mode-specific UI is rendered here -->
    </aside>
  </main>

  <footer class="statusbar">
    <span class="engine-status">
      <span class="dot" id="engine-dot"></span>
      <span id="engine-status">Stockfish: idle</span>
    </span>
    <span class="hint">Built with chess.js + Stockfish &middot; <span id="app-version">dev</span></span>
  </footer>

  <script src="vendor/chess.min.js"></script>
  <script src="js/openings.js"></script>
  <script src="js/tricks.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/board.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/build-info.js"></script>
  <script src="js/updater.js"></script>
</body>
</html>
