name: Build Mac App

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci 2>&1 | tee install.log

      - name: Compute build version
        run: echo "BUILD_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Bump package.json and embed build info
        run: |
          node -e "const p=require('./package.json');p.version=process.env.BUILD_VERSION;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -e "require('fs').writeFileSync('js/build-info.js','// Generated at build time by GitHub Actions.\nwindow.BUILD_VERSION = \"'+process.env.BUILD_VERSION+'\";\n')"
          grep '"version"' package.json
          cat js/build-info.js

      - name: Build Mac app (.dmg, unsigned, arm64)
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee build.log
        env:
          # Skip code-signing — produces an unsigned build.
          # macOS will warn on first launch; right-click → Open to bypass.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder

      - name: List build output
        if: always()
        run: ls -la dist/ || true

      - name: Upload Mac build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-openings-trainer-mac
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.blockmap

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: ignore
          path: |
            install.log
            build.log

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: Chess Openings Trainer v${{ env.BUILD_VERSION }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.blockmap
          body: |
            Auto-built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            Drag the `.dmg` into Applications. First launch: right-click → Open → Open
            to bypass the unsigned-app warning.
