name: Build Mac & Windows App

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            ext: dmg
            label: Mac
          - os: windows-latest
            target: win
            ext: exe
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump package.json and embed build info
        run: node scripts/bump-version.js
        env:
          BUILD_VERSION: 1.0.${{ github.run_number }}

      - name: Build ${{ matrix.label }} app
        run: npm run dist:${{ matrix.target }} 2>&1 | tee build.log
        shell: bash
        env:
          BUILD_VERSION: 1.0.${{ github.run_number }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder

      - name: List build output
        if: always()
        run: ls -la dist/ || true
        shell: bash

      - name: Print build log on failure
        if: failure()
        run: |
          echo "=========================================="
          echo "BUILD LOG (printed inline so you can read it without downloading the artifact)"
          echo "=========================================="
          cat build.log || echo "(no build.log produced)"
          echo "=========================================="
        shell: bash

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          if-no-files-found: ignore
          path: build.log

      - name: Upload ${{ matrix.label }} artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-openings-trainer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.${{ matrix.ext }}
            dist/*.blockmap

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chess Openings Trainer v1.0.${{ github.run_number }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/*.${{ matrix.ext }}
            dist/*.blockmap
          body: |
            Auto-built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Mac**: download the `.dmg`, drag into Applications. First launch:
            right-click → Open → Open to bypass the unsigned-app warning.

            **Windows**: download the `.exe`, run it. If SmartScreen warns,
            click "More info" → "Run anyway".
