name: Build Mac App

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci 2>&1 | tee install.log

      - name: Build Mac app (.dmg, unsigned, arm64)
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee build.log
        env:
          # Skip code-signing — produces an unsigned build.
          # macOS will warn on first launch; right-click → Open to bypass.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder

      - name: List build output
        if: always()
        run: ls -la dist/ || true

      - name: Upload Mac build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-openings-trainer-mac
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.blockmap

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: ignore
          path: |
            install.log
            build.log
