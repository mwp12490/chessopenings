name: Build Mac & Windows App

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            ext: dmg
            label: Mac
          - os: windows-latest
            target: win
            ext: exe
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Compute build version
        run: echo "BUILD_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
        shell: bash

      - name: Bump package.json and embed build info
        run: |
          node -e "const p=require('./package.json');p.version=process.env.BUILD_VERSION;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -e "require('fs').writeFileSync('js/build-info.js','// Generated at build time by GitHub Actions.\nwindow.BUILD_VERSION = \"'+process.env.BUILD_VERSION+'\";\n')"
          grep '"version"' package.json
          cat js/build-info.js
        shell: bash

      - name: Build ${{ matrix.label }} app
        run: |
          set -o pipefail
          npm run dist:${{ matrix.target }} 2>&1 | tee build.log
        shell: bash
        env:
          # Skip code-signing — produces unsigned builds. macOS shows a
          # right-click → Open warning the first time; Windows shows a
          # SmartScreen "More info → Run anyway" the first time.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder

      - name: List build output
        if: always()
        run: ls -la dist/ || true
        shell: bash

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          if-no-files-found: ignore
          path: build.log

      - name: Upload ${{ matrix.label }} artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-openings-trainer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.${{ matrix.ext }}
            dist/*.blockmap

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: Chess Openings Trainer v${{ env.BUILD_VERSION }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/*.${{ matrix.ext }}
            dist/*.blockmap
          body: |
            Auto-built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Mac**: download the `.dmg`, drag into Applications. First launch:
            right-click → Open → Open to bypass the unsigned-app warning.

            **Windows**: download the `.exe`, run it. If SmartScreen warns,
            click "More info" → "Run anyway".
