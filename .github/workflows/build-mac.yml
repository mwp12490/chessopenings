name: Build Mac App

on:
  push:
    branches:
      - claude/chess-openings-trainer-1evIs
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Mac app (.dmg + .zip, unsigned)
        run: npm run dist:mac
        env:
          # Skip code-signing — produces an unsigned build.
          # macOS will warn on first launch; right-click → Open to bypass.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List build output
        run: ls -la dist/

      - name: Upload Mac build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chess-openings-trainer-mac
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
